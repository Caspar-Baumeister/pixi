name: pixi
description: "Pixi – My Year in Pixels. Ein Jahr, ein Bild, ein Pixel pro Tag."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  url_launcher: ^6.3.1
  purchases_flutter: ^9.0.0
  in_app_review: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FAF9F6"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
  # RevenueCat's Swift package does not compile with the current Xcode;
  # the CocoaPods build of the same version does. Stay on CocoaPods.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/cats/idle/
    - assets/cats/badges/
    - assets/cats/stretch.webp
    - assets/cats/neutral.webp
    - assets/cats/neutral_still.png
    - assets/cats/stretch_still.png
    - assets/cats/wave.webp
    - assets/cats/wave_still.png
    - assets/cats/curious.webp
    - assets/cats/curious_still.png
    - assets/cats/sad.webp
    - assets/cats/sad_still.png
    - assets/cats/happy.webp
    - assets/cats/happy_still.png
    - assets/cats/gym.webp
    - assets/cats/gym_still.png
    - assets/cats/bell.webp
    - assets/cats/bell_still.png
    - assets/cats/sleep.webp
    - assets/cats/sleep_still.png
    - assets/cats/dreams_still.png
    - assets/cats/dreams.webp
    - assets/cats/period_still.png
    - assets/cats/period.webp
    - assets/cats/alcohol_still.png
    - assets/cats/alcohol.webp
    - assets/cats/social_still.png
    - assets/cats/social.webp
    - assets/cats/pain_still.png
    - assets/cats/pain.webp
    - assets/cats/screen_still.png
    - assets/cats/screen.webp
    - assets/cats/gratitude_still.png
    - assets/cats/gratitude.webp
    - assets/cats/energy_still.png
    - assets/cats/energy.webp
    - assets/cats/anxiety_still.png
    - assets/cats/anxiety.webp
    - assets/cats/reading_still.png
    - assets/cats/reading.webp
    - assets/cats/water_still.png
    - assets/cats/water.webp
    - assets/cats/meditation_still.png
    - assets/cats/meditation.webp
    - assets/icon/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
